name: Offline Python tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Offline suite (${{ matrix.os }} / Python 3.13)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run full offline suite (not Hermes runtime)
        shell: bash
        run: |
          test -d tests || { echo 'tests/ has not been committed yet'; exit 1; }
          python -m unittest discover -s tests -v
